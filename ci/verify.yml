# STAGED TEMPLATE ONLY. This file is intentionally not under .github/workflows,
# so GitHub Actions does not execute it. Owner approval/workflow scope is needed
# before moving it to .github/workflows/verify.yml.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Public personal-repository exception: no private self-hosted runner assumed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Referee, API, CLI, and replay verification
        run: npm run verify
      - name: Real browser end-to-end
        run: npm run test:e2e
